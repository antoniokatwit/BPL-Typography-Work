<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boston Public Library — Building in Words</title>

<!-- =================================================================
     FONTS
     Oswald = the condensed words that build stone, iron, glass, bronze
     Cinzel = carved Roman-style inscriptions and names
     ================================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Oswald:wght@200..700&display=swap">

<!-- =================================================================
     PAGE STYLE
     Screen: centred, scales to the window.
     Print : one 7 × 7 in page (7.5 × 7.5 in when opened with ?bleed=0.25).
     ================================================================= -->
<style>
  html, body { margin: 0; background: #e9e4dc; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  #art { width: min(92vmin, 1008px); aspect-ratio: 1; background: #F3EDE4;
         box-shadow: 0 10px 40px rgba(43, 30, 25, .25); }
  #art svg { width: 100%; height: 100%; display: block; }
  @page { margin: 0; }
  @media print {
    html, body { background: none; }
    main { padding: 0; min-height: 0; display: block; }
    #art { width: var(--print-size, 7in); height: var(--print-size, 7in); box-shadow: none; }
  }
</style>
</head>

<body>
<main>
  <!-- The building is drawn into this box by the script below -->
  <div id="art"></div>
</main>

<script>
/* #####################################################################
   1. SETTINGS — edit freely, then reload the page
   ##################################################################### */

const SEED = 11;            // same number = same arrangement of words

const W = 672, H = 672;     // trim size in units (672 = 7 in at 96 per inch)

// Bleed: extra artwork past the trim for printing. Open the page with
// ?bleed=0.25 in the address bar for a 0.25 in bleed (7.5 × 7.5 in total).
const BLEED_IN = Number(new URLSearchParams(location.search).get("bleed") || 0);
const B  = BLEED_IN * 96;                  // bleed in drawing units
const X0 = -B, X1 = W + B;                 // full drawing extents
const Y0 = -B, Y1 = H + B;

/* ---------- Words: which words build which part ---------- */
const WORDS = {
  all:   ["COMMUNITY", "BELONGING", "LISTEN", "LEARN", "CARE", "CREATE", "JUSTICE",
          "EQUITY", "WELCOME", "OPEN", "MAKE ROOM", "MANY VOICES", "SHARED FUTURE",
          "WE BUILD TOGETHER"],
  stone: ["LEARN", "LISTEN", "CARE", "CREATE", "MANY VOICES", "COMMUNITY"],   // granite
  dark:  ["JUSTICE", "EQUITY", "COMMUNITY", "BELONGING", "LISTEN"],           // shadow, outlines
  iron:  ["JUSTICE", "EQUITY", "OPEN", "CARE"],                               // gates, lanterns
  glass: ["WELCOME", "OPEN", "MAKE ROOM", "BELONGING"],                       // light & glass
  roof:  ["SHARED FUTURE", "CREATE", "CARE"],                                 // red tile roof
  green: ["CARE", "CREATE", "BELONGING", "LEARN"],                            // plants
  bronze:["LISTEN", "LEARN", "CREATE", "MANY VOICES"],                        // statues
  flag:  ["MANY VOICES", "EQUITY", "JUSTICE", "BELONGING"],                   // flags
  steps: [["LISTEN", "LEARN", "CARE", "CREATE"], ["MANY VOICES"], ["MAKE ROOM"],
          ["SHARED FUTURE"], ["COMMUNITY"], ["WE BUILD TOGETHER"]],         // top → bottom step
};

/* ---------- Carved text that is on the real building ---------- */
const INSCRIPTION = "THE PUBLIC LIBRARY OF THE CITY OF BOSTON · BUILT BY THE PEOPLE AND DEDICATED TO THE ADVANCEMENT OF LEARNING";
const OVER_DOOR   = "FREE TO ALL";
const PEDESTALS   = ["MANY VOICES", "SHARED FUTURE"];  // carved on the two statue bases

/* ---------- Leaders: names carved in the window panels, quotes in the paving ---------- */
const QUOTES = [
  ["INJUSTICE ANYWHERE IS A THREAT TO JUSTICE EVERYWHERE", "MARTIN LUTHER KING JR."],
  ["NOBODY’S FREE UNTIL EVERYBODY’S FREE", "FANNIE LOU HAMER"],
  ["GET IN GOOD TROUBLE, NECESSARY TROUBLE", "JOHN LEWIS"],
  ["UNBOUGHT AND UNBOSSED", "SHIRLEY CHISHOLM"],
  ["SÍ, SE PUEDE", "DOLORES HUERTA"],
  ["EDUCATION IS THE MOST POWERFUL WEAPON WHICH YOU CAN USE TO CHANGE THE WORLD", "NELSON MANDELA"],
  ["ONE CHILD, ONE TEACHER, ONE BOOK, ONE PEN CAN CHANGE THE WORLD", "MALALA YOUSAFZAI"],
  ["THE TIME IS ALWAYS RIGHT TO DO WHAT IS RIGHT", "MARTIN LUTHER KING JR."],
  ["THERE IS NOT SUCH A CRADLE OF DEMOCRACY UPON THE EARTH AS THE FREE PUBLIC LIBRARY", "ANDREW CARNEGIE"],
];
// Panels under the outer windows (left → right); the centre three carry relief medallions.
const PANEL_NAMES = ["DOLORES HUERTA", "MARTIN LUTHER KING JR.", "FANNIE LOU HAMER",
                     "JOHN LEWIS", "SHIRLEY CHISHOLM", "NELSON MANDELA"];

/* ---------- Colours ---------- */
const C = {
  // the five core colours
  brown: "#4B3831", red: "#CA4213", orange: "#F98C45", gray: "#CBCBCB", blue: "#C5E4E7",
  // light and shadow
  deep: "#2B1E19", midBrown: "#7A5A4B", rust: "#9E300C", amber: "#FFC08F",
  highlight: "#FFFDF8", paper: "#F3EDE4",
  // pink-granite stone (the real building is Milford pink granite)
  stone: "#D3C5B8", stoneShade: "#A99686", stoneLight: "#ECE4DB",
  // glass
  glassDark: "#2E3A40", navy: "#3F5963", deepBlue: "#86B3BA",
  // wrought iron
  iron: "#221E1C", ironLight: "#74675C",
  // bronze statues
  bronze: "#3D3427", bronzeLight: "#9A8762", verdigris: "#6C7B68",
  // plants
  leafDark: "#2F4224", leaf: "#4F6B3B", leafLight: "#8FAA66",
  // flags
  flagRed: "#B8361A", flagWhite: "#F7F1E8", flagStripe: "#D9CFC2", flagBlue: "#2E3F66", brass: "#B08D57",
  // plaza paving
  paving: "#D6BBA8",
};

/* ---------- Layout (drawing units; y grows downward) ---------- */
const L = {
  roof:   [16, 38],
  cornice:[38, 54],
  frieze: [54, 74],        // inscription band under the cornice
  upper:  [78, 234],       // upper storey (arched windows)
  belt:   [234, 250],      // heavy band between storeys
  ground: [250, 516],      // ground storey (doorways)
  landing:[516, 528],
  steps:  [528, 600],      // six granite steps
  plaza:  600,

  bays: [-96, 0, 96, 192, 288, 384, 480, 576, 672, 768].map((x) => x + 48),  // window centres
  win:  { r: 30, ring: 38, spring: 120, bottom: 200 },                         // upper windows
  roundelY: 92, roundelR: 9,                                                   // circles between arches

  doors: [240, 336, 432],                                // entrance centres
  door: { r: 31, ring: 41, spring: 336, bottom: 516 },
  lanterns: [192, 288, 384, 480], lanternTop: 290,       // lantern fixtures (on the piers)
  plants:   [192, 288, 384, 480],                        // potted plants (under the lanterns)
  groundWindows: [48, 144, 528, 624],
  flags: [240, 336, 432, 624],                           // windows that carry a flag
  statues: [{ x: 96, holds: "globe" }, { x: 576, holds: "book" }],
  pedestalTop: 486,
};


/* #####################################################################
   2. HELPERS — small tools everything else is built from
   ##################################################################### */

/* ---------- Seeded random numbers (repeatable) ---------- */
let rand;
function seededRandom(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const between = (a, b) => a + rand() * (b - a);

/* ---------- Output buffers ---------- */
let defs = [], body = [], uid = 0;
const newId = (p) => `${p}${++uid}`;
const n1  = (v) => (+v).toFixed(1);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const rad = (deg) => deg * Math.PI / 180;

/* ---------- Measuring letters ---------- */
const measureCtx = document.createElement("canvas").getContext("2d");
const widthCache = new Map();
function letterWidth(ch, size, weight, family = "Oswald") {
  const key = ch + "|" + weight + "|" + family;
  if (!widthCache.has(key)) {
    measureCtx.font = `${weight} 100px ${family}`;
    widthCache.set(key, measureCtx.measureText(ch).width / 100);
  }
  return widthCache.get(key) * size;
}
const textWidth = (t, size, weight, spacing = 0, family = "Oswald") =>
  [...t].reduce((sum, ch) => sum + letterWidth(ch, size, weight, family) + spacing, 0);

/* ---------- A run of words long enough to fill n characters ---------- */
function wordRun(words, n, sep = " ") {
  let i = Math.floor(rand() * words.length), s = "";
  while (s.length < n) { s += words[i % words.length] + sep; i++; }
  return s.trim();
}

/* ---------- Shapes ---------- */
const rect   = (x, y, w, h) => `<rect x="${n1(x)}" y="${n1(y)}" width="${n1(w)}" height="${n1(h)}"/>`;
const path   = (d) => `<path d="${d}"/>`;
const circle = (cx, cy, r) => `<circle cx="${n1(cx)}" cy="${n1(cy)}" r="${n1(r)}"/>`;
const ellipse= (cx, cy, rx, ry) => `<ellipse cx="${n1(cx)}" cy="${n1(cy)}" rx="${n1(rx)}" ry="${n1(ry)}"/>`;
const poly   = (pts) => `<polygon points="${pts.map(([x, y]) => n1(x) + "," + n1(y)).join(" ")}"/>`;
const rectD  = (x, y, w, h) => `M${n1(x)},${n1(y)} H${n1(x + w)} V${n1(y + h)} H${n1(x)} Z`;
const circleD= (cx, cy, r) => `M${n1(cx - r)},${n1(cy)} a${n1(r)},${n1(r)} 0 1,1 ${n1(2 * r)},0 a${n1(r)},${n1(r)} 0 1,1 ${n1(-2 * r)},0 Z`;
const BIG    = rectD(X0 - 60, Y0 - 60, X1 - X0 + 120, Y1 - Y0 + 120);

// Arch: straight sides, half-circle top. archLine = same, open, for text to follow.
const arch = (cx, spring, r, bottom) =>
  `M${n1(cx - r)},${n1(bottom)} L${n1(cx - r)},${n1(spring)} A${n1(r)},${n1(r)} 0 0 1 ${n1(cx + r)},${n1(spring)} L${n1(cx + r)},${n1(bottom)} Z`;
const archLine = (cx, spring, r, bottom) =>
  `M${n1(cx - r)},${n1(bottom)} L${n1(cx - r)},${n1(spring)} A${n1(r)},${n1(r)} 0 0 1 ${n1(cx + r)},${n1(spring)} L${n1(cx + r)},${n1(bottom)}`;

// A thick line as a polygon (arms, bars).
function limb(x1, y1, x2, y2, w1, w2 = w1) {
  const L_ = Math.hypot(x2 - x1, y2 - y1) || 1, nx = -(y2 - y1) / L_, ny = (x2 - x1) / L_;
  return [poly([[x1 + nx * w1 / 2, y1 + ny * w1 / 2], [x2 + nx * w2 / 2, y2 + ny * w2 / 2],
                [x2 - nx * w2 / 2, y2 - ny * w2 / 2], [x1 - nx * w1 / 2, y1 - ny * w1 / 2]]), circle(x2, y2, w2 / 2)];
}

const withHoles = (outer, ...holes) => path(outer + " " + holes.join(" "));
const inside  = (d) => [path(d), "nonzero"];             // keep words inside shape d
const outside = (d) => [withHoles(BIG, d), "evenodd"];    // keep words outside shape d

/* ---------- Clip paths ---------- */
function clipId(shapes, rule = "nonzero") {
  const id = newId("c");
  let s = Array.isArray(shapes) ? shapes.join("") : shapes;
  if (rule === "evenodd") s = s.replace(/<(path|rect|polygon|circle|ellipse) /g, '<$1 clip-rule="evenodd" ');
  defs.push(`<clipPath id="${id}">${s}</clipPath>`);
  return id;
}

/* ---------- Fades (masks) ---------- */
const stopsSvg = (stops) => stops.map(([at, a]) => `<stop offset="${at}" stop-color="#fff" stop-opacity="${a}"/>`).join("");
const maskBox = `maskUnits="userSpaceOnUse" x="${X0 - 60}" y="${Y0 - 60}" width="${X1 - X0 + 120}" height="${Y1 - Y0 + 120}"`;
function fadeLinear(x, y, w, h, stops, vertical = true) {
  const g = newId("g"), m = newId("m");
  defs.push(`<linearGradient id="${g}" x1="0" y1="0" x2="${vertical ? 0 : 1}" y2="${vertical ? 1 : 0}">${stopsSvg(stops)}</linearGradient>`);
  defs.push(`<mask id="${m}" ${maskBox}><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${g})"/></mask>`);
  return m;
}
function fadeRadial(cx, cy, rx, ry, stops) {
  const g = newId("g"), m = newId("m");
  defs.push(`<radialGradient id="${g}" cx="0.5" cy="0.5" r="0.5">${stopsSvg(stops)}</radialGradient>`);
  defs.push(`<mask id="${m}" ${maskBox}><rect x="${cx - rx}" y="${cy - ry}" width="${2 * rx}" height="${2 * ry}" fill="url(#${g})"/></mask>`);
  return m;
}
const glow = (cx, cy, rx, ry) => fadeRadial(cx, cy, rx, ry, [[0, 1], [0.5, 0.5], [1, 0]]);

/* ---------- WORD FILL: the core technique ----------
   Covers a box with parallel lines of words at any angle, clipped to shapes.
     clips : [[shape, rule], ...]   several = only where they all overlap
     box   : [x0, y0, x1, y1]       area to cover
     size  : letter size            gap : distance between lines
   Options:
     angle     reading direction in degrees (0 = left→right, -90 = upward,
               90 = downward, 45 = diagonal down-right). Default -90.
     weight, spacing, opacity (number or [min,max]), fade (mask id),
     colorFn(i) / opacityFn(i)  vary per line (i = line number)              */
function wordFill(clips, box, words, size, gap, color, opt = {}) {
  const { angle = -90, weight = 500, spacing = 0.4, opacity = 1, fade, colorFn, opacityFn, family = "Oswald" } = opt;
  const [x0, y0, x1, y1] = box;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, bw = x1 - x0, bh = y1 - y0;
  const dx = Math.cos(rad(angle)), dy = Math.sin(rad(angle));   // along the line
  const nx = -dy, ny = dx;                                         // across the lines
  const along  = (Math.abs(dx) * bw + Math.abs(dy) * bh) / 2 + size;   // half-length of each line
  const across = (Math.abs(nx) * bw + Math.abs(ny) * bh) / 2 + size;   // half-width of the area
  const lines = [];
  let i = 0;
  for (let t = -across + rand() * gap; t < across; t += gap, i++) {
    const shift = rand() * size * 8;
    const sx = cx + nx * t - dx * (along + shift), sy = cy + ny * t - dy * (along + shift);
    const chars = Math.floor((2 * along + shift) / (size * 0.42 + spacing)) + 4;
    const col = colorFn ? colorFn(i) : color;
    const op  = opacityFn ? opacityFn(i) : Array.isArray(opacity) ? between(opacity[0], opacity[1]) : opacity;
    lines.push(`<text x="${n1(sx)}" y="${n1(sy)}" transform="rotate(${n1(angle)} ${n1(sx)} ${n1(sy)})" ` +
               `fill="${col}" opacity="${op.toFixed(2)}">${esc(wordRun(words, chars))}</text>`);
  }
  let g = `<g font-family="${family}" font-weight="${weight}" font-size="${size}" letter-spacing="${spacing}">${lines.join("")}</g>`;
  for (const [shape, rule] of [...clips].reverse()) g = `<g clip-path="url(#${clipId(shape, rule)})">${g}</g>`;
  if (fade) g = `<g mask="url(#${fade})">${g}</g>`;
  body.push(g);
}

/* ---------- TEXT ALONG A PATH: letters placed one by one ---------- */
const probe = document.createElementNS("http://www.w3.org/2000/svg", "path");
const probeSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
probeSvg.setAttribute("style", "position:absolute;width:0;height:0;overflow:hidden");
probeSvg.appendChild(probe);
document.body.appendChild(probeSvg);

function textAlong(d, words, size, color, opt = {}) {
  const { weight = 600, spacing = 0.5, start = 0, opacity = 1, text, sep = " · " } = opt;
  probe.setAttribute("d", d);
  const total = probe.getTotalLength();
  const pointAt = (s) => {
    const a = probe.getPointAtLength(Math.max(0, s - 0.3)), b = probe.getPointAtLength(Math.min(total, s + 0.3));
    const p = probe.getPointAtLength(s);
    return [p.x, p.y, Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI];
  };
  const str = text || wordRun(words, Math.ceil(total / (size * 0.4)) + 10, sep);
  const out = [];
  for (let s = start, i = 0; i < 100000; i++) {
    const ch = str[i % str.length];
    const w = letterWidth(ch, size, weight) + spacing;
    if (s + w > total) break;
    if (ch !== " ") {
      const [x, y, a] = pointAt(s + w / 2);
      const bx = x - Math.sin(rad(a)) * size * 0.36, by = y + Math.cos(rad(a)) * size * 0.36;   // centre on the line
      out.push(`<text x="${n1(bx)}" y="${n1(by)}" transform="rotate(${a.toFixed(0)} ${n1(bx)} ${n1(by)})">${esc(ch)}</text>`);
    }
    s += w;
  }
  body.push(`<g fill="${color}" font-family="Oswald" font-weight="${weight}" font-size="${size}" text-anchor="middle" opacity="${opacity}">${out.join("")}</g>`);
}
const line = (x1, y1, x2, y2) => `M${n1(x1)},${n1(y1)} L${n1(x2)},${n1(y2)}`;

/* ---------- RINGS: concentric circles of words (plants, roundels, globe) ---------- */
function ringFill(cx, cy, rOuter, rInner, words, size, gap, color, opt = {}) {
  for (let r = rOuter; r >= rInner; r -= gap)
    textAlong(circleD(cx, cy, r), words, size, opt.colorFn ? opt.colorFn(r) : color, { spacing: 0.2, start: rand() * 6, ...opt });
}

/* ---------- RAYS: words pointing out from a centre (arch stones, fanlights) ---------- */
function rayFill(cx, cy, r0, r1, a0, a1, step, words, size, color, opt = {}) {
  for (let a = a0; a <= a1 + 0.01; a += step)
    textAlong(line(cx + Math.cos(rad(a)) * r0, cy + Math.sin(rad(a)) * r0, cx + Math.cos(rad(a)) * r1, cy + Math.sin(rad(a)) * r1),
              words, size, color, { spacing: 0.2, ...opt });
}

/* ---------- CARVED TEXT: light copy offset behind a dark one ---------- */
function carved(x, y, text, color, attrs) {
  for (const [dx, dy, col] of [[0.6, 0.7, C.highlight], [0, 0, color]])
    body.push(`<text x="${n1(x + dx)}" y="${n1(y + dy)}" text-anchor="middle" fill="${col}" ${attrs}>${esc(text)}</text>`);
}
// Fit a carved line into a width (shrinks the letters if needed).
function carvedFit(x, y, text, color, maxW, size, weight = 700) {
  const w = textWidth(text, size, weight, 0.4, "Cinzel");
  const s = w > maxW ? size * maxW / w : size;
  carved(x, y, text, color, `font-family="Cinzel" font-weight="${weight}" font-size="${s.toFixed(2)}" letter-spacing="0.4"`);
}

/* ---------- Knock out the paper behind a shape (so it sits cleanly on top) ---------- */
const knockout = (shape) => body.push(shape.replace("/>", ` fill="${C.paper}"/>`));


/* #####################################################################
   3. THE BUILDING — drawn back to front, one part per function.
      Light comes from the upper left: shadows fall to the right and down.
   ##################################################################### */

/* ---------- Sky + red tile roof ---------- */
function drawRoof() {
  const [top, bottom] = L.roof;
  const sky = [inside(rectD(X0, Y0, X1 - X0, top - Y0))];
  wordFill(sky, [X0, Y0, X1, top], ["MANY VOICES", "SHARED FUTURE"], 4.4, 5.2, C.blue, { spacing: 1.2 });

  const roof = [inside(rectD(X0, top + 2, X1 - X0, bottom - top - 2))], box = [X0, top, X1, bottom];
  wordFill(roof, box, WORDS.roof, 4.2, 3.9, C.red, { angle: -62, weight: 700, spacing: 0.3 });              // tiles, slanted
  wordFill(roof, box, ["SHARED FUTURE", "CREATE"], 3.4, 7.6, C.orange,
           { angle: -62, weight: 600, fade: fadeLinear(X0, top, X1 - X0, bottom - top, [[0, 1], [0.6, 0]]) });  // sunlit
  wordFill(roof, box, ["CARE", "JUSTICE"], 3.4, 3.8, C.deep,
           { angle: 0, weight: 700, fade: fadeLinear(X0, top, X1 - X0, bottom - top, [[0.5, 0], [1, 0.85]]) });  // eave shade
  wordFill([inside(rectD(X0, top - 1, X1 - X0, 3))], [X0, top - 2, X1, top + 2], WORDS.all, 2.4, 2.0, C.brown, { angle: 0, weight: 700, spacing: 0 });
}

/* ---------- Cornice: fascia, dentils, under-shadow ---------- */
function drawCornice() {
  const [top] = L.cornice;
  wordFill([inside(rectD(X0, top, X1 - X0, 8))], [X0, top, X1, top + 8], WORDS.dark, 2.8, 2.5, C.brown, { angle: 0, weight: 700, spacing: 0 });
  wordFill([inside(rectD(X0, top, X1 - X0, 2.5))], [X0, top, X1, top + 2.5], WORDS.dark, 2.4, 3.0, C.stoneLight, { angle: 0, weight: 600, spacing: 0 });
  const blocks = [], shades = [];
  for (let x = X0 - 6; x < X1; x += 9) { blocks.push(rect(x, top + 9, 5.5, 5.5)); shades.push(rect(x + 5.5, top + 9, 2.5, 6)); }
  wordFill([[shades, "nonzero"]], [X0, top + 8, X1, top + 16], ["CARE"], 2.2, 1.7, C.deep, { weight: 700, spacing: 0, opacity: 0.6 });
  wordFill([[blocks, "nonzero"]], [X0, top + 8, X1, top + 16], ["CARE", "LEARN"], 2.2, 1.8, C.brown, { weight: 700, spacing: 0 });
}

/* ---------- Inscription frieze (real carved text) ---------- */
function drawFrieze() {
  const [top, bottom] = L.frieze;
  const band = [inside(rectD(X0, top, X1 - X0, bottom - top))], box = [X0, top, X1, bottom];
  wordFill(band, box, WORDS.stone, 3.4, 4.2, C.stone, { angle: 0, weight: 400, spacing: 0.8 });
  wordFill(band, box, WORDS.dark, 3.0, 2.6, C.midBrown, { angle: 0, weight: 600, spacing: 0,
           fade: fadeLinear(X0, top, X1 - X0, 10, [[0, 0.8], [1, 0]]) });                                   // shadow under cornice
  carvedFit(336, top + 13.5, INSCRIPTION, C.deep, W - 40, 8.6);
  wordFill([inside(rectD(X0, bottom, X1 - X0, 4))], [X0, bottom, X1, bottom + 4], WORDS.all, 2.4, 2.0, C.brown, { angle: 0, weight: 700, spacing: 0 });
}

/* ---------- Upper storey wall ---------- */
function drawUpperWall() {
  const [top, bottom] = L.upper, { r, ring, spring, bottom: wb } = L.win;
  const holes = L.bays.map((cx) => arch(cx, spring, ring, wb + 4));
  const wall = [withHoles(rectD(X0, top, X1 - X0, bottom - top), ...holes), "evenodd"], box = [X0, top, X1, bottom];
  wordFill([wall], box, WORDS.stone, 4.8, 5.8, C.stone, { weight: 400, spacing: 0.8, opacity: [0.85, 1] });        // piers, vertical
  wordFill([wall], box, ["LISTEN", "CARE", "LEARN"], 3.8, 9, C.stoneShade, { angle: 90, weight: 300, opacity: [0.2, 0.5] });
  wordFill([wall], [X0, top, X1, top + 30], WORDS.dark, 3.4, 3.0, C.midBrown, { weight: 600, spacing: 0.2,
           fade: fadeLinear(X0, top, X1 - X0, 30, [[0, 0.8], [1, 0]]) });                                       // shadow under frieze
}

/* ---------- Roundels: the circles between the tops of the arches ---------- */
function drawRoundels() {
  const y = L.roundelY, r = L.roundelR;
  for (let i = 0; i < L.bays.length - 1; i++) {
    const x = (L.bays[i] + L.bays[i + 1]) / 2;
    knockout(circle(x, y, r + 1.5));
    wordFill([inside(circleD(x + 1.6, y + 1.6, r + 1))], [x - r, y - r, x + r + 4, y + r + 4], ["CARE"], 2.2, 1.8, C.deep, { weight: 700, spacing: 0, opacity: 0.45 }); // shadow
    knockout(circle(x, y, r));
    ringFill(x, y, r - 1.2, 1.5, ["LISTEN", "LEARN", "CARE"], 2.3, 2.2, C.stoneShade, { weight: 500 });
    textAlong(circleD(x, y, r - 0.6), WORDS.dark, 2.4, C.brown, { weight: 700, spacing: 0.1 });
    textAlong(circleD(x, y, 4.2), ["OPEN"], 2.0, C.rust, { weight: 700, spacing: 0.1 });
  }
}

/* ---------- Upper windows: dark glass with an iron grid, moulded arch ---------- */
function drawUpperWindows() {
  const { r, ring, spring, bottom } = L.win;
  for (const cx of L.bays) {
    const glass = arch(cx, spring, r, bottom), outer = arch(cx, spring, ring, bottom + 4);
    const box = [cx - ring, spring - ring, cx + ring, bottom + 4], gbox = [cx - r, spring - r, cx + r, bottom];

    // Moulded arch ring: stone, joints pointing out from the centre, lit and shaded edges
    wordFill([[path(outer + " " + glass), "evenodd"]], box, WORDS.stone, 2.6, 2.4, C.stoneShade, { weight: 600, spacing: 0 });
    rayFill(cx, spring, r + 1, ring - 1, 180, 360, 12, ["LEARN", "CARE"], 2.2, C.brown, { weight: 700, opacity: 0.7 });
    textAlong(archLine(cx, spring, ring - 1, bottom + 4), ["LEARN", "LISTEN", "COMMUNITY"], 2.6, C.brown, { weight: 700 });
    textAlong(archLine(cx, spring, r + 1.5, bottom), WORDS.dark, 2.4, C.deep, { weight: 700 });

    // Glass: dark, with sky reflection at the top, iron grid, reveal shadow
    wordFill([inside(glass)], gbox, WORDS.dark, 3.4, 2.8, C.glassDark, { weight: 700, spacing: 0 });
    wordFill([inside(glass)], gbox, ["LISTEN", "LEARN"], 3.0, 3.4, C.navy, { angle: 90, weight: 500,
             fade: fadeLinear(gbox[0], gbox[1], 2 * r, bottom - gbox[1], [[0, 0.9], [0.6, 0.2], [1, 0]]) });
    wordFill([inside(glass), inside(`M${cx - 12},${spring - r} L${cx + 2},${spring - r} L${cx + 26},${bottom} L${cx + 12},${bottom} Z`)],
             gbox, ["OPEN", "LEARN"], 2.8, 3.2, C.deepBlue, { weight: 600, opacity: 0.55 });                       // reflection streak
    wordFill([inside(glass)], gbox, ["OPEN", "LEARN", "LISTEN"], 2.0, 7.5, C.ironLight, { angle: 0, weight: 700, spacing: 0.1 });  // grid: rows
    wordFill([inside(glass)], gbox, ["OPEN", "LEARN", "LISTEN"], 2.0, 7.5, C.ironLight, { angle: -90, weight: 700, spacing: 0.1 }); // grid: columns
    wordFill([inside(glass), outside(arch(cx + 6, spring + 5, r, bottom + 8))], gbox, WORDS.dark, 3.0, 2.2, C.iron, { weight: 700, spacing: 0, opacity: 0.85 });

    // Sill
    wordFill([inside(rectD(cx - ring - 2, bottom + 2, 2 * ring + 4, 4))], [cx - ring - 2, bottom + 2, cx + ring + 2, bottom + 6], ["EQUITY", "CARE"], 2.4, 1.9, C.brown, { angle: 0, weight: 700, spacing: 0 });
  }
}

/* ---------- Carved panels under the windows (names, centre medallions) ---------- */
function drawPanels() {
  const y = L.win.bottom + 7, h = 24;
  let n = 0;
  for (const cx of L.bays) {
    const box = [cx - 32, y, cx + 32, y + h];
    knockout(rect(cx - 32, y, 64, h));
    wordFill([inside(rectD(cx - 32, y, 64, h))], box, WORDS.stone, 2.6, 2.8, C.stoneLight, { angle: 0, weight: 400 });
    textAlong(rectD(cx - 31, y + 1, 62, h - 2), WORDS.dark, 2.2, C.brown, { weight: 700, spacing: 0.1 });            // frame
    wordFill([inside(rectD(cx - 32, y, 64, h)), outside(rectD(cx - 30, y + 2, 64, h))], box, ["CARE"], 2.2, 1.8, C.midBrown, { weight: 700, spacing: 0, opacity: 0.6 });
    if (L.doors.includes(cx)) {
      // relief medallion with a wreath of words
      ringFill(cx, y + h / 2, 9, 2, ["LEARN", "CARE", "CREATE"], 2.2, 2.0, C.stoneShade, { weight: 600 });
      textAlong(circleD(cx, y + h / 2, 10), ["COMMUNITY"], 2.2, C.brown, { weight: 700, spacing: 0.1 });
      textAlong(line(cx - 30, y + h / 2, cx - 13, y + h / 2), ["LISTEN"], 2.2, C.midBrown, { weight: 700 });
      textAlong(line(cx + 13, y + h / 2, cx + 30, y + h / 2), ["LEARN"], 2.2, C.midBrown, { weight: 700 });
    } else {
      carvedFit(cx, y + h / 2 + 2.4, PANEL_NAMES[n++ % PANEL_NAMES.length], C.deep, 54, 6.4);
    }
  }
}

/* ---------- Flags on angled poles, with wall brackets ---------- */
function drawFlags() {
  for (const cx of L.flags) {
    const base = [cx + 24, L.win.bottom + 24];            // bracket on the panel
    const tip  = [cx - 34, L.win.spring - 8];            // pole top
    const len  = Math.hypot(tip[0] - base[0], tip[1] - base[1]);
    const u = [(base[0] - tip[0]) / len, (base[1] - tip[1]) / len];   // unit vector down the pole
    const hoist = 56, drop = 54;                          // flag size: along the pole, hanging down
    const A = tip, Bp = [tip[0] + u[0] * hoist, tip[1] + u[1] * hoist];
    const at = (k, d, wave = 0) => [A[0] + u[0] * hoist * k + wave, A[1] + u[1] * hoist * k + d];

    // The cloth hangs straight down from the pole; the bottom edge ripples
    const flag = poly([A, Bp, at(1, drop * 0.96, 1), at(0.75, drop * 1.04, -1), at(0.5, drop * 0.95, 1),
                       at(0.25, drop * 1.05, -1), at(0, drop)]);
    const fbox = [A[0] - 3, A[1], Bp[0] + 3, Bp[1] + drop + 4];
    knockout(flag);
    wordFill([[flag, "nonzero"]], fbox, WORDS.flag, 2.4, 2.75, C.flagRed,
             { angle: 90, weight: 700, spacing: 0, colorFn: (i) => (i % 2 ? C.flagStripe : C.flagRed) });          // stripes
    const canton = poly([A, at(0.45, 0), at(0.45, drop * 0.5), at(0, drop * 0.5)]);
    knockout(canton);
    wordFill([[canton, "nonzero"]], fbox, ["MANY VOICES", "EQUITY"], 2.2, 2.0, C.flagBlue, { angle: 90, weight: 700, spacing: 0 });
    wordFill([[canton, "nonzero"]], fbox, ["*"], 2.6, 3.0, C.flagWhite, { angle: 90, weight: 700, spacing: 1.4 });     // stars
    // folds: soft shadow bands down the cloth
    for (const k of [0.3, 0.62, 0.9])
      wordFill([[flag, "nonzero"]], fbox, WORDS.dark, 2.2, 2.0, C.deep, { angle: 90, weight: 600, spacing: 0,
               fade: fadeLinear(A[0] + u[0] * hoist * k - 3, A[1], 6, drop + 60, [[0, 0.22], [1, 0.22]], true) });
    textAlong(`M${n1(A[0])},${n1(A[1] + drop)} ` + [0.25, 0.5, 0.75, 1].map((k, j) => `L${n1(at(k, 0)[0] + (j % 2 ? -1 : 1))},${n1(at(k, drop * (j % 2 ? 1.04 : 0.95))[1])}`).join(" "),
              ["CARE"], 1.6, C.deep, { weight: 700, spacing: 0, opacity: 0.5 });

    // Pole, gilt finial and iron bracket
    textAlong(line(...base, ...tip), ["JUSTICE", "EQUITY"], 2.6, C.brass, { weight: 700, spacing: 0.1 });
    wordFill([inside(circleD(tip[0] - u[0] * 3, tip[1] - u[1] * 3, 2.8))], [tip[0] - 7, tip[1] - 7, tip[0] + 2, tip[1] + 2], ["CARE"], 1.8, 1.3, C.brass, { weight: 700, spacing: 0 });
    const br = poly([[base[0] - 4, base[1] - 7], [base[0] + 4, base[1] - 7], [base[0] + 4, base[1] + 6], [base[0] - 4, base[1] + 6]]);
    wordFill([[br, "nonzero"]], [base[0] - 5, base[1] - 8, base[0] + 5, base[1] + 7], WORDS.iron, 2.0, 1.5, C.iron, { weight: 700, spacing: 0 });
    textAlong(line(base[0] - 4, base[1] - 2, base[0] - 9, base[1] - 10), ["CARE"], 1.8, C.iron, { weight: 700, spacing: 0 });   // socket
  }
}

/* ---------- Belt course between the storeys ---------- */
function drawBelt() {
  const [top, bottom] = L.belt;
  wordFill([inside(rectD(X0, top, X1 - X0, 4))], [X0, top, X1, top + 4], WORDS.stone, 2.6, 2.2, C.stoneLight, { angle: 0, weight: 600, spacing: 0 });
  wordFill([inside(rectD(X0, top + 4, X1 - X0, 8))], [X0, top + 4, X1, top + 12], WORDS.stone, 3.2, 3.2, C.stoneShade, { angle: 0, weight: 500, spacing: 0.3 });
  wordFill([inside(rectD(X0, top + 12, X1 - X0, bottom - top - 12))], [X0, top + 12, X1, bottom], WORDS.dark, 2.4, 2.0, C.brown, { angle: 0, weight: 700, spacing: 0 });
}

/* ---------- Ground-storey wall: stone courses, piers, lantern glow ---------- */
let groundWall;
function drawGroundWall() {
  const [top, bottom] = L.ground, d = L.door;
  const holes = [
    ...L.doors.map((cx) => arch(cx, d.spring, d.ring, bottom)),
    ...L.groundWindows.map((cx) => rectD(cx - 24, 330, 48, 92)),
  ];
  groundWall = [withHoles(rectD(X0, top, X1 - X0, bottom - top), ...holes), "evenodd"];
  const box = [X0, top, X1, bottom];

  // Stone courses: rows of words, with a thin joint between courses
  const courses = [];
  for (let y = top + 1; y < bottom; y += 14) courses.push(rect(X0, y, X1 - X0, 12.6));
  wordFill([groundWall, [courses, "nonzero"]], box, WORDS.stone, 5.0, 6.3, C.stone, { angle: 0, weight: 400, spacing: 0.7, opacity: [0.8, 1] });
  wordFill([groundWall], box, ["CARE", "CREATE", "LEARN"], 4.0, 11, C.stoneShade, { angle: -90, weight: 300, opacity: [0.15, 0.45] });
  wordFill([groundWall], [X0, top, X1, top + 30], WORDS.dark, 3.4, 2.8, C.midBrown, { weight: 600, spacing: 0.2,
           fade: fadeLinear(X0, top, X1 - X0, 30, [[0, 0.9], [1, 0]]) });                                        // shadow under the belt
  wordFill([groundWall], [X0, 430, X1, bottom], WORDS.dark, 3.8, 4.2, C.midBrown, { spacing: 0.3,
           fade: fadeLinear(X0, 430, X1 - X0, bottom - 430, [[0, 0], [1, 0.55]]) });                              // darker near the ground

  // Lantern light on the wall
  for (const x of L.lanterns)
    wordFill([groundWall], [x - 44, L.lanternTop - 30, x + 44, L.lanternTop + 90], ["CARE", "WELCOME"], 4.0, 2.8, C.orange,
             { weight: 600, fade: fadeRadial(x, L.lanternTop + 26, 42, 60, [[0, 0.9], [0.45, 0.4], [1, 0]]) });

  carved(336, 278, OVER_DOOR, C.rust, `font-family="Cinzel" font-weight="800" font-size="11" letter-spacing="2.6"`);
}

/* ---------- Ground-floor windows: stone lintel, dark grid glass ---------- */
function drawGroundWindows() {
  for (const cx of L.groundWindows) {
    const g = [cx - 16, 344, 32, 68];
    // lintel: a flat arch of stones fanning out
    wordFill([inside(rectD(cx - 24, 330, 48, 12))], [cx - 24, 330, cx + 24, 342], WORDS.stone, 2.6, 2.4, C.stoneShade, { weight: 600 });
    for (let dx = -22; dx <= 22; dx += 5.5) textAlong(line(cx + dx * 0.8, 342, cx + dx, 330), ["CARE"], 2.0, C.brown, { weight: 700 });
    wordFill([inside(`M${cx - 5},330 H${cx + 5} L${cx + 3.5},343 H${cx - 3.5} Z`)], [cx - 5, 329, cx + 5, 344], ["LEARN"], 2.2, 1.8, C.brown, { weight: 700, spacing: 0 });
    // frame + glass
    wordFill([[path(rectD(cx - 20, 342, 40, 74) + " " + rectD(...g)), "evenodd"]], [cx - 20, 342, cx + 20, 416], ["EQUITY", "CARE"], 2.4, 1.9, C.stoneShade, { weight: 700, spacing: 0 });
    wordFill([inside(rectD(...g))], [g[0], g[1], g[0] + g[2], g[1] + g[3]], WORDS.dark, 3.2, 2.6, C.glassDark, { weight: 700, spacing: 0 });
    wordFill([inside(rectD(...g))], [g[0], g[1], g[0] + g[2], g[1] + g[3]], ["LEARN"], 2.8, 3.2, C.navy, { angle: 90,
             fade: fadeLinear(g[0], g[1], g[2], g[3], [[0, 0.9], [1, 0.1]]) });
    wordFill([inside(rectD(...g))], [g[0], g[1], g[0] + g[2], g[1] + g[3]], ["OPEN"], 1.9, 7, C.ironLight, { angle: 0, weight: 700, spacing: 0.1 });
    wordFill([inside(rectD(...g))], [g[0], g[1], g[0] + g[2], g[1] + g[3]], ["OPEN"], 1.9, 8, C.ironLight, { angle: -90, weight: 700, spacing: 0.1 });
    wordFill([inside(rectD(...g)), outside(rectD(g[0] + 5, g[1] + 6, g[2], g[3]))], [g[0], g[1], g[0] + g[2], g[1] + g[3]], WORDS.dark, 2.8, 2.0, C.iron, { weight: 700, spacing: 0, opacity: 0.85 });
    // sill + shadow
    wordFill([inside(rectD(cx - 24, 416, 48, 5))], [cx - 24, 416, cx + 24, 421], ["EQUITY"], 2.4, 1.9, C.brown, { angle: 0, weight: 700, spacing: 0 });
    wordFill([groundWall, inside(rectD(cx - 20, 421, 50, 8))], [cx - 20, 421, cx + 30, 429], WORDS.dark, 2.6, 2.2, C.midBrown, { weight: 600, spacing: 0, opacity: 0.6 });
  }
}

/* ---------- Entrances: stone arches, iron gates, fanlights, open centre door ---------- */
function drawEntrances() {
  const { r, ring, spring: S, bottom } = L.door;
  for (const cx of L.doors) {
    const outer = arch(cx, S, ring, bottom), open = arch(cx, S, r, bottom);
    const box = [cx - ring - 6, S - ring - 8, cx + ring + 8, bottom], obox = [cx - r, S - r, cx + r, bottom];
    const isCentre = cx === 336;

    // Cast shadow of the arch on the wall
    wordFill([inside(arch(cx + 4, S + 4, ring, bottom + 4)), outside(outer), groundWall], box, WORDS.dark, 3.0, 2.2, C.deep, { weight: 700, spacing: 0, opacity: 0.5 });

    // Arch ring: stone wedges (words point outward), keystone, lit edge
    const ringShape = [path(outer + " " + open), "evenodd"];
    wordFill([ringShape], box, WORDS.stone, 3.0, 3.0, C.stone, { angle: 0, weight: 500, spacing: 0.2 });
    rayFill(cx, S, r + 0.5, ring - 0.5, 180, 360, 3.1, WORDS.stone, 2.4, C.stoneShade, { weight: 500 });            // wedge texture
    rayFill(cx, S, r + 0.5, ring - 0.5, 180, 360, 15, ["CARE"], 2.4, C.brown, { weight: 700, opacity: 0.8 });        // joints
    for (let y = S + 13; y < bottom; y += 14) {                                                                       // jamb joints
      textAlong(line(cx - ring, y, cx - r, y), ["CARE"], 2.2, C.brown, { weight: 700, opacity: 0.7 });
      textAlong(line(cx + r, y, cx + ring, y), ["CARE"], 2.2, C.brown, { weight: 700, opacity: 0.7 });
    }
    wordFill([ringShape, outside(arch(cx - 3, S - 3, ring, bottom))], box, ["CARE"], 3.0, 2.2, C.midBrown, { weight: 600, spacing: 0, opacity: 0.5 });
    wordFill([ringShape, inside(arch(cx - 2.5, S - 2.5, ring, bottom)), outside(arch(cx + 1.5, S + 1.5, ring, bottom))], box, ["OPEN"], 2.6, 2.0, C.highlight, { weight: 700, spacing: 0 });
    const key = `M${cx - 6},${S - ring - 5} H${cx + 6} L${cx + 4},${S - r} H${cx - 4} Z`;
    knockout(path(key));
    wordFill([inside(key)], [cx - 7, S - ring - 6, cx + 7, S - r], ["CREATE", "OPEN"], 2.4, 2.0, C.stoneShade, { weight: 700, spacing: 0 });
    textAlong(key.replace(" Z", ` L${cx - 6},${S - ring - 5}`), ["CARE"], 2.0, C.brown, { weight: 700 });
    textAlong(archLine(cx, S, ring + 0.8, bottom), WORDS.dark, 2.6, C.brown, { weight: 700 });

    // Opening: dark vestibule behind the gates, with warm light from inside
    wordFill([inside(open)], obox, WORDS.iron, 3.4, 2.6, C.iron, { weight: 700, spacing: 0 });
    wordFill([inside(open)], obox, WORDS.glass, 3.2, 2.6, C.orange, { weight: 600,
             fade: fadeRadial(cx, S + 40, r + 10, 110, isCentre ? [[0, 0.9], [1, 0]] : [[0, 0.35], [1, 0]]) });

    // Fanlight (half-circle at the top): rays and rings of iron
    wordFill([inside(`M${cx - r},${S} A${r},${r} 0 0 1 ${cx + r},${S} Z`)], obox, WORDS.glass, 2.8, 2.6, C.amber, { weight: 500, opacity: 0.55 });
    rayFill(cx, S, 4, r - 0.5, 186, 354, 14, WORDS.iron, 2.2, C.iron, { weight: 700 });
    for (const rr of [10, 20, r - 1]) textAlong(archLine(cx, S, rr, S), WORDS.iron, 2.2, C.iron, { weight: 700 });
    for (const rr of [14, 24]) textAlong(archLine(cx, S, rr, S), ["OPEN"], 1.9, C.ironLight, { weight: 700 });

    // Transom bar
    wordFill([inside(rectD(cx - r, S, 2 * r, 5))], [cx - r, S, cx + r, S + 5], WORDS.iron, 2.4, 1.8, C.iron, { angle: 0, weight: 700, spacing: 0 });
    textAlong(line(cx - r, S + 2.5, cx + r, S + 2.5), ["OPEN"], 1.9, C.ironLight, { weight: 700 });

    // Gate leaves: diamond lattice (two diagonal directions), rails and a centre post
    const gate = [inside(rectD(cx - r, S + 5, 2 * r, bottom - S - 5))], gbox = [cx - r, S + 5, cx + r, bottom];
    if (isCentre) {
      // centre door stands open: lit interior between the two folded-back leaves
      const inner = rectD(cx - 15, S + 22, 30, bottom - S - 22);
      wordFill([inside(inner)], gbox, WORDS.glass, 3.2, 2.4, C.amber, { weight: 600 });
      wordFill([inside(inner)], gbox, WORDS.glass, 3.0, 4.0, C.orange, { angle: 90, weight: 600,
               fade: fadeLinear(cx - 15, S + 22, 30, bottom - S - 22, [[0, 0.2], [1, 0.95]]) });
      wordFill([inside(inner)], gbox, ["WELCOME"], 2.6, 6, C.highlight, { weight: 700, opacity: 0.8, fade: glow(cx, S + 60, 16, 50) });
      textAlong(rectD(cx - 15, S + 22, 30, bottom - S - 22), WORDS.iron, 2.4, C.deep, { weight: 700 });
      for (const side of [-1, 1]) {                                                                                     // open leaves
        const leaf = `M${cx + side * 15},${S + 22} L${cx + side * r},${S + 12} L${cx + side * r},${bottom} L${cx + side * 15},${bottom} Z`;
        wordFill([inside(leaf)], gbox, WORDS.iron, 3.0, 2.4, C.iron, { weight: 700, spacing: 0 });
        wordFill([inside(leaf)], gbox, ["OPEN"], 1.9, 5, C.ironLight, { angle: 45, weight: 700 });
        wordFill([inside(leaf)], gbox, ["OPEN"], 1.9, 5, C.ironLight, { angle: -45, weight: 700 });
      }
    } else {
      wordFill(gate, gbox, ["OPEN", "CARE"], 2.2, 7, C.ironLight, { angle: 45, weight: 700, spacing: 0.2 });
      wordFill(gate, gbox, ["OPEN", "CARE"], 2.2, 7, C.ironLight, { angle: -45, weight: 700, spacing: 0.2 });
      for (const dx of [-r + 1.5, -15, 15, r - 1.5]) textAlong(line(cx + dx, S + 5, cx + dx, bottom), WORDS.iron, 2.4, C.iron, { weight: 700 });
      textAlong(line(cx, S + 5, cx, bottom), WORDS.iron, 3.0, C.iron, { weight: 800 });
      for (const side of [-1, 1]) {                                                                                   // scroll medallions
        textAlong(circleD(cx + side * 15, S + 85, 9), WORDS.iron, 2.4, C.iron, { weight: 800, spacing: 0.1 });
        textAlong(circleD(cx + side * 15, S + 85, 5), ["OPEN"], 2.0, C.ironLight, { weight: 700, spacing: 0.1 });
      }
    }
    for (const y of [S + 50, S + 120]) wordFill([inside(rectD(cx - r, y, 2 * r, 4))], [cx - r, y, cx + r, y + 4], WORDS.iron, 2.2, 1.8, C.iron, { angle: 0, weight: 700, spacing: 0 });

    // Reveal shadow inside the arch (upper left)
    wordFill([inside(open), outside(arch(cx + 9, S + 12, r, bottom + 30))], obox, WORDS.dark, 3.0, 2.2, C.deep, { weight: 800, spacing: 0, opacity: 0.8 });
  }
}

/* ---------- Iron lantern fixtures: crown, main lantern, two hanging lanterns ---------- */
function drawLanterns() {
  const t = L.lanternTop;
  const ironFill = (shape, box) => wordFill([inside(shape)], box, WORDS.iron, 2.0, 1.5, C.iron, { weight: 700, spacing: 0 });
  const glassFill = (shape, box) => {
    wordFill([inside(shape)], box, ["CARE", "WELCOME"], 2.2, 1.7, C.orange, { weight: 700, spacing: 0, colorFn: () => (rand() > 0.55 ? C.amber : C.orange) });
  };
  for (const x of L.lanterns) {
    // wall plate + shadow
    wordFill([inside(rectD(x + 2, t + 6, 6, 62))], [x + 2, t + 6, x + 8, t + 68], ["CARE"], 2.2, 1.8, C.deep, { weight: 700, spacing: 0, opacity: 0.35 });
    ironFill(rectD(x - 2, t + 4, 4, 62), [x - 2, t + 4, x + 2, t + 66]);

    // scroll arms out to the side lanterns
    for (const s of [-1, 1]) {
      textAlong(`M${x},${t + 36} Q${x + s * 12},${t + 26} ${x + s * 16},${t + 38}`, WORDS.iron, 2.2, C.iron, { weight: 700, spacing: 0 });
      textAlong(`M${x},${t + 46} Q${x + s * 8},${t + 50} ${x + s * 12},${t + 42} Q${x + s * 14},${t + 38} ${x + s * 10},${t + 38}`, WORDS.iron, 1.9, C.iron, { weight: 700, spacing: 0 });
    }

    // main lantern: finial, crown, glass, base, drop
    ironFill(`M${x},${t - 6} L${x + 2},${t} L${x - 2},${t} Z`, [x - 2, t - 6, x + 2, t]);
    ironFill(`M${x - 9},${t + 8} L${x},${t} L${x + 9},${t + 8} Z`, [x - 9, t, x + 9, t + 8]);
    const g = `M${x - 7},${t + 8} H${x + 7} L${x + 5.5},${t + 30} H${x - 5.5} Z`;
    glassFill(g, [x - 7, t + 8, x + 7, t + 30]);
    for (const dx of [-7, 0, 7]) textAlong(line(x + dx * 0.8, t + 30, x + dx, t + 8), ["CARE"], 1.8, C.iron, { weight: 700, spacing: 0 });
    ironFill(`M${x - 7},${t + 30} H${x + 7} L${x + 3},${t + 36} H${x - 3} Z`, [x - 7, t + 30, x + 7, t + 36]);
    ironFill(circleD(x, t + 52, 2.2), [x - 3, t + 49, x + 3, t + 55]);

    // side lanterns hanging from the arms
    for (const s of [-1, 1]) {
      const sx = x + s * 16;
      ironFill(`M${sx - 5},${t + 42} L${sx},${t + 37} L${sx + 5},${t + 42} Z`, [sx - 5, t + 37, sx + 5, t + 42]);
      const sg = `M${sx - 4},${t + 42} H${sx + 4} L${sx + 3},${t + 54} H${sx - 3} Z`;
      glassFill(sg, [sx - 4, t + 42, sx + 4, t + 54]);
      textAlong(line(sx, t + 54, sx, t + 42), ["CARE"], 1.6, C.iron, { weight: 700, spacing: 0 });
      ironFill(`M${sx - 4},${t + 54} H${sx + 4} L${sx},${t + 59} Z`, [sx - 4, t + 54, sx + 4, t + 59]);
    }
  }
}

/* ---------- Landing in front of the doors ---------- */
function drawLanding() {
  const [top, bottom] = L.landing;
  wordFill([inside(rectD(X0, top, X1 - X0, bottom - top))], [X0, top, X1, bottom], WORDS.stone, 3.0, 3.0, C.stoneLight, { angle: 0, weight: 500, spacing: 0.3 });
  wordFill([inside(rectD(X0, top, X1 - X0, bottom - top))], [X0, top, X1, bottom], WORDS.glass, 3.0, 2.6, C.orange,
           { angle: 0, weight: 600, fade: fadeRadial(336, top + 2, 70, 22, [[0, 0.9], [1, 0]]) });                // light from the open door
}

/* ---------- Potted plants: round shrubs in planters ---------- */
function drawPlants() {
  for (const x of L.plants) {
    const pt = L.landing[0] - 18, cy = pt - 12, r = 13;
    // shadow on the wall
    wordFill([inside(circleD(x + 5, cy + 4, r)), groundWall], [x - r, cy - r, x + r + 9, cy + r + 8], ["CARE"], 2.4, 2.0, C.deep, { weight: 700, spacing: 0, opacity: 0.35 });
    // planter
    const pot = `M${x - 10},${pt} H${x + 10} L${x + 8},${L.landing[0]} H${x - 8} Z`;
    knockout(path(pot));
    wordFill([inside(pot)], [x - 10, pt, x + 10, L.landing[0]], WORDS.dark, 2.4, 2.0, C.brown, { angle: 0, weight: 700, spacing: 0 });
    wordFill([inside(pot), outside(`M${x - 13},${pt} H${x + 4} V${L.landing[0]} H${x - 13} Z`)], [x - 10, pt, x + 10, L.landing[0]], ["CARE"], 2.2, 1.8, C.deep, { weight: 700, spacing: 0, opacity: 0.6 });
    wordFill([inside(rectD(x - 11, pt, 22, 2.5))], [x - 11, pt, x + 11, pt + 2.5], ["CARE"], 2.0, 1.6, C.stoneShade, { angle: 0, weight: 700, spacing: 0 });
    // shrub: rings of green words, lit upper left, shaded lower right
    knockout(circle(x, cy, r));
    ringFill(x, cy, r - 0.8, 1.2, WORDS.green, 2.4, 1.9, C.leaf, { weight: 700, colorFn: () => (rand() > 0.5 ? C.leaf : C.leafDark) });
    wordFill([inside(circleD(x, cy, r)), inside(circleD(x - 5, cy - 5, r - 2))], [x - r, cy - r, x + r, cy + r], WORDS.green, 2.2, 3.0, C.leafLight, { angle: -45, weight: 600, opacity: [0.5, 0.9] });
    wordFill([inside(circleD(x, cy, r)), outside(circleD(x - 3, cy - 3, r))], [x - r, cy - r, x + r, cy + r], WORDS.green, 2.2, 1.8, C.leafDark, { angle: 45, weight: 700, spacing: 0, opacity: 0.85 });
  }
}

/* ---------- Six granite steps ---------- */
function drawSteps() {
  const [top, bottom] = L.steps, n = 6, hgt = (bottom - top) / n;
  for (let s = 0; s < n; s++) {
    const y = top + s * hgt;
    const nose = rectD(X0, y, X1 - X0, 1.8), tread = rectD(X0, y + 1.8, X1 - X0, 4), riser = rectD(X0, y + 5.8, X1 - X0, hgt - 5.8);
    wordFill([inside(nose)], [X0, y, X1, y + 1.8], WORDS.all, 2.0, 1.8, C.brown, { angle: 0, weight: 700, spacing: 0 });
    wordFill([inside(tread)], [X0, y + 1.8, X1, y + 5.8], WORDS.stone, 2.8, 2.6, C.stoneLight, { angle: 0, weight: 500, spacing: 0.3 });
    wordFill([inside(riser)], [X0, y + 5.8, X1, y + hgt], WORDS.steps[s], 4.6, 6.2, s === n - 1 ? C.red : C.stoneShade,
             { angle: 0, weight: s === n - 1 ? 700 : 500, spacing: 1.2, opacity: s === n - 1 ? 1 : 0.9 });
    wordFill([inside(riser)], [X0, y + 5.8, X1, y + hgt], WORDS.dark, 2.6, 2.4, C.brown, { angle: 0, weight: 700, spacing: 0,
             fade: fadeLinear(X0, y + 5.8, X1 - X0, hgt - 5.8, [[0, 0.8], [1, 0.1]]) });
  }
  // door light pooling on the top steps
  wordFill([inside(rectD(X0, top, X1 - X0, 40))], [236, top, 436, top + 40], WORDS.glass, 3.0, 2.6, C.orange,
           { angle: 0, weight: 600, fade: fadeRadial(336, top, 90, 40, [[0, 0.8], [0.5, 0.35], [1, 0]]) });
}

/* ---------- Plaza: warm paving with leaders' quotes set into it ---------- */
function drawPlaza() {
  const top = L.plaza, box = [X0, top, X1, Y1], area = [inside(rectD(X0, top, X1 - X0, Y1 - top))];
  wordFill(area, box, WORDS.all, 3.0, 3.4, C.paving, { angle: 0, weight: 400, spacing: 0.8 });
  wordFill(area, box, WORDS.stone, 2.6, 26, C.stoneShade, { angle: -90, weight: 600, opacity: 0.5 });             // paving joints
  // quotes: one line each, set like engraved stones in the paving
  let k = 0;
  for (let y = top + 13; y < Y1 - 4; y += 13) {
    let x = X0 - rand() * 80, row = [];
    while (x < X1) {
      const [q, who] = QUOTES[k++ % QUOTES.length];
      const t = `${q} — ${who}`;
      row.push(`<tspan x="${n1(x)}">${esc(q)} — <tspan fill="${C.rust}" font-weight="700">${esc(who)}</tspan></tspan>`);
      x += textWidth(t, 5.4, 600, 0.6) + 22;
    }
    body.push(`<text y="${n1(y)}" fill="${C.brown}" font-family="Oswald" font-weight="600" font-size="5.4" letter-spacing="0.6" opacity="0.9">${row.join("")}</text>`);
  }
  wordFill(area, [X0, top, X1, top + 18], WORDS.dark, 2.8, 2.4, C.deep, { angle: 0, weight: 600, spacing: 0,
           fade: fadeLinear(X0, top, X1 - X0, 18, [[0, 0.75], [1, 0]]) });                                        // shade at the foot of the steps
}

/* ---------- Granite pedestals beside the steps ---------- */
function drawPedestals() {
  const top = L.pedestalTop, bottom = L.plaza;
  L.statues.forEach(({ x }, i) => {
    // shadow on the plaza
    wordFill([inside(`M${x + 38},${bottom} L${x + 60},${bottom + 14} L${x + 20},${bottom + 14} L${x - 2},${bottom} Z`)], [x - 4, bottom, x + 62, bottom + 14], WORDS.dark, 2.6, 2.2, C.deep, { angle: 0, weight: 600, spacing: 0, opacity: 0.45 });
    const cap = rectD(x - 42, top, 84, 9), die = rectD(x - 38, top + 9, 76, bottom - top - 21), base = rectD(x - 42, bottom - 12, 84, 12);
    for (const d of [cap, die, base]) knockout(path(d));
    wordFill([inside(cap)], [x - 42, top, x + 42, top + 9], WORDS.stone, 2.8, 2.8, C.stoneShade, { angle: 0, weight: 600, spacing: 0.2 });
    wordFill([inside(rectD(x - 42, top, 84, 2))], [x - 42, top, x + 42, top + 2], WORDS.stone, 2.0, 2, C.stoneLight, { angle: 0, weight: 700, spacing: 0 });
    wordFill([inside(die)], [x - 38, top + 9, x + 38, bottom - 12], WORDS.stone, 4.4, 5.2, C.stone, { angle: 0, weight: 400, spacing: 0.5 });
    wordFill([inside(die), inside(rectD(x + 26, top + 9, 12, bottom - top))], [x + 26, top + 9, x + 38, bottom - 12], WORDS.dark, 3.0, 2.4, C.midBrown, { weight: 600, spacing: 0, opacity: 0.6 });  // shaded side
    wordFill([inside(die)], [x - 38, top + 9, x + 38, top + 20], WORDS.dark, 2.8, 2.4, C.midBrown, { angle: 0, weight: 600, spacing: 0, fade: fadeLinear(x - 38, top + 9, 76, 11, [[0, 0.8], [1, 0]]) });
    wordFill([inside(base)], [x - 42, bottom - 12, x + 42, bottom], WORDS.stone, 2.8, 2.6, C.stoneShade, { angle: 0, weight: 600, spacing: 0.2 });
    textAlong(rectD(x - 30, top + 34, 60, 30), WORDS.dark, 2.0, C.brown, { weight: 700, spacing: 0.1 });            // carved panel
    carvedFit(x, top + 52, PEDESTALS[i], C.deep, 52, 7);
  });
}

/* ---------- Seated bronze statues ----------
   Drawn around (0,0) = centre of the statue's base, then moved and scaled
   into place, so the figure can be resized with STATUE_SCALE.            */
const STATUE_SCALE = 1.3;
function drawStatues() {
  const base = L.pedestalTop;
  for (const { x, holds } of L.statues) {
    body.push(`<g transform="translate(${x} ${base}) scale(${STATUE_SCALE})">`);
    const box = [-30, -70, 30, 0];
    const bronze = (shapes, opt = {}) => {             // one part of the figure
      const sh = [shapes, "nonzero"];
      for (const s of shapes) knockout(s);
      wordFill([sh], box, WORDS.bronze, 2.3, 1.85, opt.color || C.bronze, { angle: opt.angle ?? -72, weight: 700, spacing: 0 });
      wordFill([sh], box, WORDS.bronze, 2.1, 2.8, C.bronzeLight, { angle: opt.angle ?? -72, weight: 600, spacing: 0,
               fade: fadeRadial(-12, -52, 30, 34, [[0, 0.95], [1, 0]]) });                       // light from upper left
      wordFill([sh], box, WORDS.dark, 2.1, 1.8, C.deep, { angle: opt.angle ?? -72, weight: 700, spacing: 0,
               fade: fadeRadial(20, -12, 26, 34, [[0, 0.85], [1, 0]]) });                        // shade lower right
    };
    const rim = (d, op = 0.95) => textAlong(d, ["LEARN", "CARE"], 1.5, C.bronzeLight, { weight: 700, spacing: 0, opacity: op });
    const edge = (d) => textAlong(d, ["CARE"], 1.5, C.deep, { weight: 700, spacing: 0, opacity: 0.9 });

    // cast shadow on the wall behind
    wordFill([inside(`M-20,-40 L26,-40 L32,-4 L-18,-4 Z`), groundWall], box, ["CARE"], 2.2, 1.8, C.deep, { weight: 700, spacing: 0, opacity: 0.3 });

    // throne (seat with a high back) — darker
    bronze([path(`M-20,-44 Q-20,-48 -16,-48 L16,-48 Q20,-48 20,-44 L22,-5 L-22,-5 Z`)], { color: C.deep, angle: 0 });
    // bronze plinth
    bronze([rect(-27, -5, 54, 5)], { angle: 0 });
    edge(line(-27, -5, 27, -5));
    // robe over the knees, falling to the feet
    const robe = `M-14,-34 Q0,-37 14,-34 Q22,-30 24,-5 L-24,-5 Q-22,-30 -14,-34 Z`;
    bronze([path(robe)]);
    rim(`M-24,-6 Q-22,-30 -14,-34 Q0,-37 14,-34`);
    // folds in the robe
    for (const [a, b, c] of [[-4, -9, -15], [4, 9, 15], [0, -1, -3], [9, 15, 21], [-10, -15, -21]])
      edge(`M${a},-33 Q${b},-20 ${c},-6`);
    // feet
    bronze([ellipse(-7, -6, 4.2, 2.3), ellipse(7, -6, 4.2, 2.3)], { angle: 0 });
    // torso with a draped mantle
    const torso = `M-9,-53 L9,-53 Q13,-44 13,-34 L-13,-34 Q-13,-44 -9,-53 Z`;
    bronze([path(torso)]);
    edge(`M-6,-52 Q-2,-44 6,-36`); edge(`M6,-52 Q3,-46 9,-40`);
    rim(`M-13,-35 Q-13,-44 -9,-53`);
    // arms: left rests on the lap, right raised to hold the object
    bronze([...limb(-10, -50, -16, -39, 5.2, 4.6), ...limb(-16, -39, -6, -32, 4.6, 4)]);
    rim(`M-12.5,-51 L-18.5,-39`);
    bronze([...limb(10, -50, 17, -41, 5.2, 4.6)]);
    // neck + head (separated from the shoulders by a thin gap), hair gathered back
    knockout(circle(0, -58, 6.2));
    bronze([rect(-2, -55, 4, 4)], { angle: 0 });
    bronze([circle(0, -58.5, 5)], { angle: -90 });
    bronze([ellipse(0, -61.5, 5.6, 3.2)], { angle: 0, color: C.deep });     // hair
    rim(`M-5,-58 A5,5 0 0 1 0,-63.5`);
    // the object she holds
    if (holds === "globe") {
      bronze([circle(19, -45, 7)], { angle: 0 });
      textAlong(`M12,-45 A7,2.6 0 0 0 26,-45`, ["LEARN"], 1.4, C.bronzeLight, { weight: 700, spacing: 0 });
      textAlong(`M19,-52 A2.8,7 0 0 1 19,-38`, ["LEARN"], 1.4, C.bronzeLight, { weight: 700, spacing: 0 });
      rim(`M12.5,-46 A7,7 0 0 1 19,-52`);
    } else {
      bronze([poly([[11, -50], [25, -46], [23, -31], [9, -35]])], { angle: 15 });
      for (let k = 1; k < 4; k++) textAlong(line(10.5, -46 + k * 3.5, 24, -42 + k * 3.5), ["LEARN"], 1.3, C.bronzeLight, { weight: 700, spacing: 0 });
      rim(line(11, -50, 25, -46));
    }
    body.push(`</g>`);
  }
}


/* #####################################################################
   4. ASSEMBLE — paint order matters: later parts sit on top
   ##################################################################### */
function buildBuilding() {
  rand = seededRandom(SEED);
  defs = []; body = []; uid = 0;

  body.push(`<rect x="${X0 - 60}" y="${Y0 - 60}" width="${X1 - X0 + 120}" height="${Y1 - Y0 + 120}" fill="${C.paper}"/>`);

  drawRoof();
  drawCornice();
  drawFrieze();
  drawUpperWall();
  drawRoundels();
  drawUpperWindows();
  drawPanels();
  drawBelt();
  drawGroundWall();
  drawGroundWindows();
  drawEntrances();
  drawLanterns();
  drawLanding();
  drawPlants();
  drawSteps();
  drawPlaza();
  drawPedestals();
  drawStatues();
  drawFlags();

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${X0} ${Y0} ${X1 - X0} ${Y1 - Y0}" role="img" ` +
         `aria-label="The Boston Public Library entrance built entirely from words">` +
         `<defs>${defs.join("")}</defs>${body.join("")}</svg>`;
}


/* #####################################################################
   5. RUN — wait for the fonts (so letters measure correctly), then draw
   ##################################################################### */
(async () => {
  try {
    await Promise.all([300, 400, 500, 600, 700, 800].map((w) => document.fonts.load(`${w} 10px Oswald`)));
    await Promise.all([700, 800].map((w) => document.fonts.load(`${w} 10px Cinzel`)));
  } catch (e) { /* browser's own font is used if offline */ }
  widthCache.clear();
  document.documentElement.style.setProperty("--print-size", `${7 + 2 * BLEED_IN}in`);
  document.getElementById("art").innerHTML = buildBuilding();
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
